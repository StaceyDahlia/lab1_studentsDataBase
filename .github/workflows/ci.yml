name: C/C++ CI with Coverage

on:
  push:
    branches: [ "feature/stud_spec" ]
  pull_request:
    branches: [ "feature/stud_spec" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev gcovr

          # Build GoogleTest
          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib/

      - name: Build with coverage
        run: make coverage

      - name: Run tests
        run: ./program_coverage.out

      - name: Generate gcov report
        run: |
          gcov main.cpp || true

      - name: Extract coverage and update badge
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # покрытие
          COVERAGE=$(gcov main.cpp | grep -o '[0-9]\+\.[0-9]\+%' | head -1 | sed 's/%//')
          if [ -z "$COVERAGE" ]; then
            COVERAGE="0.0"
          fi
          echo "Coverage: $COVERAGE%"

          # Цвет бейджа
          if (( $(echo "$COVERAGE >= 90" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$COVERAGE >= 70" | bc -l) )); then
            COLOR="yellowgreen"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR="yellow"
          elif (( $(echo "$COVERAGE >= 40" | bc -l) )); then
            COLOR="orange"
          else
            COLOR="red"
          fi

          echo "Badge color: $COLOR"

          JSON_CONTENT=$(cat <<EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${COVERAGE}%",
            "color": "$COLOR"
          }
          EOF
          )

          

          # echo "Coverage badge updated!"

      - name: Regular build (without coverage)
        run: make all

      - name: Run tests (normal build)
        run: ./program.out
