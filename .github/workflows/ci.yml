name: C/C++ CI with Coverage Badge

on:
  push:
    branches: [ "feature/spec_stud" ]
  pull_request:
    branches: [ "feature/spec_stud" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev gcovr

      - name: Build and run tests with coverage
        run: |
          make coverage

      - name: Show coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.cobertura.xml
          badge: true
          format: markdown
          output: both

      - name: Get coverage %
        id: coverage
        run: |
          COVERAGE=$(grep -o 'line-rate="[0-9.]*"' coverage.cobertura.xml | head -1 | grep -o '[0-9.]*')
          COVERAGE_INT=$(awk "BEGIN {printf(\"%.0f\", $COVERAGE * 100)}")
          echo "coverage=$COVERAGE_INT" >> $GITHUB_OUTPUT
          echo "COVERAGE=$COVERAGE_INT%" >> $GITHUB_ENV

      - name: Determine badge color
        id: badge_color
        run: |
          COV=${{ steps.coverage.outputs.coverage }}
          if [ "$COV" -ge 90 ]; then COLOR=green;
          elif [ "$COV" -ge 75 ]; then COLOR=yellow;
          else COLOR=red;
          fi
          echo "color=$COLOR" >> $GITHUB_OUTPUT

      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@v1.0.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.GIST_ID }}
          filename: coverage.json
          label: coverage
          message: "${{ env.COVERAGE }}"
          color: ${{ steps.badge_color.outputs.color }}
